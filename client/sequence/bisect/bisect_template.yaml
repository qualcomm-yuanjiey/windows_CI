# ============================================================
# Bisect per-commit sequence template
# ============================================================
# This file is auto-generated by bisect_runner.py for each
# commit under test.  Do NOT edit by hand – edit the template
# inside bisect_runner.py instead.
#
# Placeholders substituted at generation time:
#   COMMIT_ID  – short commit hash being tested
#   LOG_PATH   – /tmp/serial_logs/COMMIT_ID_serial_log
# ============================================================

sequence:

  - id: git_checkout
    action: linux_shell
    params:
      command: "git -C /local/mnt/workspace/yyj/develop_linux/git-repository/Talos_repository/github/qli-mainline/kernel checkout {commit_id}"
      timeout: 60
    on_fail: abort

  - id: read_uart
    action: read_uart
    params:
      output: "{log_path}"

  - id: compile_repo
    action: linux_shell
    params:
      command: >-
        cd /local/mnt/workspace/yyj/develop_linux/git-repository/Talos_repository/upstream_linux-next/linux-sheepdog &&
        python3 sheepdog-slave.py
        --repo-config template-slave-qli.ini
        --local=/local/mnt/workspace/yyj/develop_linux/git-repository/Talos_repository/github/qli-mainline/kernel
        --compile-config qli-config
        --board-config talos_config.yaml
        --build_only
      timeout: 3600
    on_fail: abort

  - id: power_off
    action: power_off
    params:
      sleep: 5

  - id: boot_edl
    action: boot_edl
    params:
      sleep: 15

  - id: flash_image
    action: windows_shell
    params:
      command: "talos_shell246.bat"
      timeout: 180
    on_fail: abort

  - id: power_on
    action: power_on
    params:
      sleep: 10

  - id: record_log
    action: stop_uart
    params:
      duration: 60

  - id: power_off
    action: power_off
    params:
      sleep: 5
